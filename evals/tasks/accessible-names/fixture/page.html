<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Leave a message</title></head>
<body>
  <header>
    <img class="logo" src="/img/logo.svg">
    <button class="icon" id="theme"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/></svg></button>
    <button class="icon" id="menu"><svg viewBox="0 0 16 16"><path d="M2 4h12M2 8h12M2 12h12"/></svg></button>
  </header>
  <main>
    <img class="decor" src="/img/wave.svg">
    <h1>Leave a message</h1>
    <p>Messages appear after review.</p>
    <img class="photo" src="/img/desk.jpg">
    <form>
      <input id="email" type="email" placeholder="you@example.com">
      <textarea id="message" placeholder="Say hello"></textarea>
      <button type="submit">Send</button>
    </form>
  </main>
</body>
</html>
