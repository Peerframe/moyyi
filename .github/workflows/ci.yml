name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Install the native Linux sandbox
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap=0.9.0-1ubuntu0.3 apparmor-profiles=4.0.1really4.0.1-0ubuntu0.24.04.9
          sudo apparmor_parser -r /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          bwrap --version

      - name: Check
        run: npm run check

      - name: Native shell conformance
        run: npm run eval:shell

      - name: Long-session conformance
        run: npm run eval:long-sessions

      - name: Anthropic offline conformance
        run: npm run eval:anthropic

      - name: Web authority conformance
        run: npm run eval:web

      - name: Installable candidate and client protocol
        run: npm run verify:package
